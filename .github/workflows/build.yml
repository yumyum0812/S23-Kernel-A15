name: Kernel Build

on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout manifest repository
      uses: actions/checkout@v4

    - name: Maximize Swap Space
      run: |
        sudo swapoff -a
        sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Cache Toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: toolchain
        key: ${{ runner.os }}-toolchain-${{ hashFiles('**/default.xml') }}
        restore-keys: |
          ${{ runner.os }}-toolchain-

    - name: Download or update toolchain
      run: |
        echo "Starting download toolchain...."
        chmod +x ./download_toolchain.sh
        ./download_toolchain.sh

    - name: Run Build
      run: |
        echo "Starting kernel build..."
        chmod +x ./build_kernel_GKI.sh
        ./build_kernel_GKI.sh

    - name: Find Created Files (Debug)
      run: |
        echo "find created files"
        echo "=== カーネルバイナリ（Image）の候補を特定 ==="
        find . -name "Image" -o -name "zImage" -o -name "bzImage" -o -name "Image.gz" -o -name "*.ko" -o -name "*.img"
