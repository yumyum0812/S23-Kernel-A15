name: Kernel Build

on:
  # push:
  #  branches: [ main ]
  workflow_dispatch:
    inputs:
      lto_mode:
        description: 'Select LTO Mode (none = Fast build, thin = Default/Balanced, full = Max optimization)'
        required: true
        type: choice
        default: 'none'
        options:
          - none
          - thin
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 1024
        swap-size-mb: 8192
        remove-android: 'true'
        remove-dotnet: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout manifest repository
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        chmod +x setup_env.sh
        ./setup_env.sh
      
    # - name: Cache Toolchain
    # id: cache-toolchain
    #   uses: actions/cache@v4
    #   with:
    #     path: toolchain
    #     key: ${{ runner.os }}-toolchain-${{ hashFiles('**/default.xml') }}
    #     restore-keys: |
    #       ${{ runner.os }}-toolchain-

    - name: Download or update toolchain
      run: |
        echo "Starting download toolchain...."
        chmod +x ./download_toolchain.sh
        ./download_toolchain.sh

    - name: Run Build
      env:
        LTO: ${{ github.event.inputs.lto_mode }}
      run: |
        (
          while true; do
            sleep 120
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CI Status: Kernel build is still running..."
          done
        ) &
        MONITOR_PID=$!
        
        echo "Starting kernel build..."
        chmod +x ./build_kernel_GKI.sh
        export MAKEFLGS="-j($nproc)"
        export LTO="none"
        ./build_kernel_GKI.sh

        kill $MONITOR_PID

    - name: Find Created Files (Debug)
      run: |
        echo "find created files"
        find out -name "Image" -o -name "zImage" -o -name "bzImage" -o -name "Image.gz" -o -name "*.ko" -o -name "*.img"
