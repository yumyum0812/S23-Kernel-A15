name: Kernel Build

on:
  # push:
  #  branches: [ main ]
  workflow_dispatch:
    inputs:
      lto_mode:
        description: 'Select LTO Mode (none = Fast build, thin = Default/Balanced, full = Max optimization)'
        required: true
        type: choice
        default: 'none'
        options:
          - none
          - thin
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 1024
        swap-size-mb: 8192
        remove-android: 'true'
        remove-dotnet: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout manifest repository
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        chmod +x setup_env.sh
        ./setup_env.sh
    
    - name: Download toolchain
      run: |
        echo "Starting download toolchain...."
        chmod +x ./download_toolchain.sh
        ./download_toolchain.sh

    - name: Run build
      env:
        LTO: ${{ github.event.inputs.lto_mode }}
      run: |
        (
          while true; do
            sleep 120
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CI Status: Kernel build is still running..."
          done
        ) &
        MONITOR_PID=$!
        
        echo "Starting kernel build..."
        chmod +x ./build_kernel_GKI.sh
        export MAKEFLGS="-j($nproc)"
        export LTO="none"
        export POST_DEFCONFIG_CMDS="
            unset BUILD_BOOT_IMG &&
            unset BUILD_VENDOR_BOOT_IMG &&
            unset BUILD_VENDOR_KERNEL_BOOT &&
            unset BUILD_INIT_BOOT_IMG &&
            unset SUPER_IMAGE_CONTENTS &&
            unset VENDOR_DLKM_MODULES_LIST &&
            unset BUILD_DTBO_IMG
        "
        ./build_kernel_GKI.sh

        kill $MONITOR_PID

    - name: Find created files
      run: |
        echo "find created files"
        target_names=(
            "Image"
            "Image.lz4"
            "Image.gz"
            "zImage"
            "bzImage"
            "*.img"
        )

        args=()
        for name in "${target_names[@]}"; do
            args+=( -name "$name" -o )
        done
        unset 'args[-1]'

        find ./out -type f \( "${args[@]}" \) -exec sh -c '
            for f do
                size=$(du -h "$f" | cut -f1)
                hash=$(sha256sum "$f" | cut -d" " -f1)
                printf "%8s  %s  %s\n" "$size" "$hash" "$f"
            done
        ' sh {} +

    - name: Collect build artifacts
      run: |
          mkdir -p ./artifacts

          target_files=(
            "./out/msm-kalama-kalama-gki/dist/Image.lz4"
          )

          for f in "${target_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "$f not found" >&2
              exit 1
            fi
            
            cp "$f" "./artifacts/$(basename "$f")"
            if [ $? -ne 0 ]; then
              echo "failed to copy $f to ./artifacts/$(basename "$f")" >&2
              exit 1
            fi
          done

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.run_number }}
        path: ./artifacts/*
        retention-days: 7
        if-no-files-found: error
