name: Kernel Build

on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 2048
        swap-size-mb: 8192
        remove-android: 'true'
        remove-dotnet: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
    
    - name: Checkout manifest repository
      uses: actions/checkout@v4
      
    - name: Cache Toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: toolchain
        key: ${{ runner.os }}-toolchain-${{ hashFiles('**/default.xml') }}
        restore-keys: |
          ${{ runner.os }}-toolchain-

    - name: Download or update toolchain
      run: |
        echo "Starting download toolchain...."
        chmod +x ./download_toolchain.sh
        ./download_toolchain.sh

    - name: Run Build
      run: |
        (
          while true; do
            sleep 120
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CI Status: Kernel build is still running..."
          done
        ) &
        MONITOR_PID=$!
        
        echo "Starting kernel build..."
        chmod +x ./build_kernel_GKI.sh
        ./build_kernel_GKI.sh

        kill $MONITOR_PID

    - name: Find Created Files (Debug)
      run: |
        echo "find created files"
        find . -name "Image" -o -name "zImage" -o -name "bzImage" -o -name "Image.gz" -o -name "*.ko" -o -name "*.img"
